services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow
      POSTGRES_DB: assetflow
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  pgbouncer:
    image: edoburu/pgbouncer
    depends_on: [postgres]
    environment:
      DATABASE_URL: "postgres://assetflow:assetflow@postgres:5432/assetflow"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
    ports: ["6432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: